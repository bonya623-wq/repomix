version: "3.9"

services:
  goha-news-bot:
    build: .
    container_name: goha_news_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/published.json:/app/published.json
      - ./data/bot.log:/app/bot.log
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
